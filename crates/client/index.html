<!doctype html>
<!-- trunk가 이 파일을 읽어서 caravan-client를 wasm으로 빌드하고, 불러오는 코드를 아래에 넣습니다.
     실행: crates/client에서 `trunk serve` 뒤에 http://127.0.0.1:8080/ 를 엽니다(시작 화면).
     선택: ?room=CODE (방 코드 미리 채움), &name=NAME (이름 미리 채움, 둘 다 있으면 곧바로 입장),
     &server=ws://HOST:7777 (서버 주소), &debug-net (메시지 로그를 브라우저 콘솔에 출력)
     caravan-public-url 칸은 caravan-dedicated가 이 파일을 내줄 때만 채워집니다(서버의 공개 주소이고, 모르면 빈 글자).
     trunk serve가 내준 페이지처럼 채워지지 않은 페이지는 서버가 따로 있다고 보고 ws://127.0.0.1:7777에 접속합니다.
     채워진 페이지는 연 주소의 서버에 접속하고, 초대 링크는 공개 주소로 만듭니다. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE LAST CARAVAN</title>
    <meta name="caravan-public-url" content="{{public_url}}" />
    <link data-trunk rel="rust" data-bin="caravan-client" />
    <style>
      html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
      #bevy { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="bevy"></canvas>
  </body>
</html>
