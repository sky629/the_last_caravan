<!doctype html>
<!-- trunk가 이 파일을 읽어서 caravan-client를 wasm으로 빌드하고, 불러오는 코드를 아래에 넣습니다.
     실행: crates/client에서 `trunk serve` 뒤에 http://127.0.0.1:8080/ 를 엽니다(시작 화면).
     선택: ?room=CODE (방 코드 미리 채움), &name=NAME (이름 미리 채움, 둘 다 있으면 곧바로 입장),
     &server=ws://HOST:7777 (서버 주소), &debug-net (메시지 로그를 브라우저 콘솔에 출력) -->
